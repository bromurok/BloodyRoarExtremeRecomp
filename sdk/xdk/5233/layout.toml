# XDK 5233 library data layouts for Bloody Roar: Extreme (proven by default.xbe)
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x0EB3C0 reads it, compares with +4, calls MakeSpace
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x0EB3C0 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x0EB600 stores BaseVertexIndex
CDevice_IndexBuffer   = 0x0388  # D3DDevice_SetIndices 0x0EB5DA reads the old one, 0x0EB600 stores the new one
CDevice_ZScale        = 0x0508  # D3DDevice_GetViewportOffsetAndScale 0x0EDD8F scales the Z range by it
CDevice_SuperSampleX  = 0x0518  # D3DDevice_GetViewportOffsetAndScale 0x0EDE01 scales viewport X by it
CDevice_SuperSampleY  = 0x051C  # D3DDevice_GetViewportOffsetAndScale 0x0EDE23 scales viewport Y by it
CDevice_Transforms    = 0x0810  # D3DDevice_SetTransform 0x0EAED2 copies 16 dwords to +0x0810 + type * 64
CDevice_Textures      = 0x0B38  # D3DDevice_SetTexture 0x0EB370 reads [stage], 0x0EB3B0 stores [stage]
CDevice_Palettes      = 0x0B48  # D3DDevice_SetPalette 0x0EB530 reads [stage], 0x0EB560 stores [stage]
CDevice_RenderTarget  = 0x15B4  # D3DDevice_GetRenderTarget2 0x0EB1CD returns it
CDevice_Depth         = 0x15B8  # D3DDevice_GetDepthStencilSurface2 0x0EB1ED returns it
CDevice_BackBuffer    = 0x15C0  # D3DDevice_GetBackBuffer2 0x0EB17D returns it for index 0
CDevice_FrontBuffer   = 0x15C4  # D3DDevice_GetBackBuffer2 0x0EB17D returns it for index -1
CDevice_SwapCount     = 0x2018  # D3DDevice_Swap 0x0EF4D0 increments it at 0x0EF530
CDevice_Size          = 0x2040  # Direct3D_CreateDevice 0x0F0410 clears 0x810 dwords (0x2040 bytes)
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x0F03C0 ors BehaviorFlags & 0x10 into it
CDevice_Time              = 0x2C   # D3DDevice_SetTexture 0x0EB390 reads [ebp+0x2C]
CDevice_PixelShader       = 0x036C # D3DDevice_SetPixelShader 0x0F5800 stores the handle
CDevice_VertexShader      = 0x037C # D3DDevice_SetVertexShader 0x0EC050 stores the current one
CDevice_BackBufferScale   = 0x0520 # the frame buffer init stores the X scale, +4 the Y scale
CDevice_Viewport          = 0x0A90 # D3DDevice_SetViewport stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0x0AA8 # D3DDevice_SetScreenSpaceOffset 0x0EB8D2 stores x + 0.53125, y + 0.53125 at +4
CDevice_AutoDepth         = 0x15D0 # the frame buffer init stores the depth buffer
CDevice_VBlankCallback    = 0x1958 # D3DDevice_BlockUntilVerticalBlank / VBlank callback at 0x0EB020
CDevice_VBlankEvent       = 0x195C # D3DDevice_BlockUntilVerticalBlank 0x0EB058 waits on it
CDevice_DisplayFlags      = 0x197C # D3D_GetAdapterDisplayMode reads it
CDevice_VBlankCount       = 0x1988 # vertical blank count
CDevice_Field             = 0x1998 # vertical blank field
CDevice_GammaRamps        = 0x19A4 # D3DDevice_SetGammaRamp
CDevice_GammaPending      = 0x1FA4 # D3DDevice_SetGammaRamp sets pending bit
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x0F5820 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x0EC3D0 indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_CreatePixelShader stores the definition pointer
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor stores the second vtable
EffectsImage_Skip0    = 0x804   # adds this dword count
EffectsImage_Skip1    = 0x80C   # loads this dword count
EffectsImage_Desc     = 0x818   # descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices returns it
XPP_Changed           = 0x4     # XGetDevices clears it, XGetDeviceChanges tests it
XPP_Previous          = 0x8     # XGetDevices copies Current into it
